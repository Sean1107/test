name: Deploy GO Toolkit to GitHub Pages
on:
  push:
    branches: ["main"]
    paths:
      - "pokemon-pvp/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pokemon-go-pages"
  cancel-in-progress: true
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate application syntax
        run: |
          node --check pokemon-pvp/app.js
          python3 -m py_compile pokemon-pvp/sync_data.py
      - name: Sync public game data
        run: python3 pokemon-pvp/sync_data.py
      - name: Commit refreshed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokemon-pvp/data
          if ! git diff --cached --quiet; then
            git commit -m "Update public Pokémon GO dataset"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "pokemon-pvp"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
