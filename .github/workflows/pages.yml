name: Deploy GO Toolkit to GitHub Pages
on:
  push:
    branches: ["main"]
    paths:
      - "pokemon-pvp/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pokemon-go-pages"
  cancel-in-progress: true
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python for offline translation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache Argos Traditional Chinese model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate/packages
          key: argos-en-zt-v1.9-ubuntu-latest
      - name: Prepare offline Traditional Chinese translator
        run: |
          python -m pip install --disable-pip-version-check argostranslate
          python - <<'PY'
          import argostranslate.package
          import argostranslate.translate

          installed = argostranslate.translate.get_installed_languages()
          has_pair = any(
              language.code == "en" and any(t.to_lang.code == "zt" for t in language.translations)
              for language in installed
          )
          if not has_pair:
              packages = argostranslate.package.get_available_packages()
              package = next((p for p in packages if p.from_code == "en" and p.to_code == "zt"), None)
              if package is None:
                  raise SystemExit("Argos en -> Traditional Chinese model was not found")
              package_path = package.download()
              argostranslate.package.install_from_path(package_path)
          print("Argos en -> Traditional Chinese ready:", argostranslate.translate.translate("Upcoming Pokémon GO events", "en", "zt"))
          PY
      - name: Validate application syntax
        run: |
          node --check pokemon-pvp/app.js
          python3 -m py_compile pokemon-pvp/sync_data.py
      - name: Sync public game data
        run: python3 pokemon-pvp/sync_data.py
      - name: Commit refreshed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokemon-pvp/data
          if ! git diff --cached --quiet; then
            git commit -m "Update public Pokémon GO dataset"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "pokemon-pvp"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
