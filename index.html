  <style>
    :root{color-scheme:light;--ink:#172c26;--muted:#486259;--line:#cddbd1;--paper:#fffef9;--wash:#edf2e9;--green:#165442;--dark:#12382f;--gold:#f5ce80;--mist:#e9f2e7;--error:#983e2b;--focus:#9b4b0c;--shadow:0 12px 36px #1f493512}
    *{box-sizing:border-box}
    body{margin:0;background:#f6f6ed;color:var(--ink);font:16px/1.6 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
    h1,h2,h3,p{margin:0}
    button,select,input,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    button:disabled{cursor:default;opacity:.45}
    :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    .wrap{width:min(1152px,calc(100% - 48px));margin-inline:auto}
    .mast{background:var(--dark);color:#fffef2;overflow:hidden}
    .mast .wrap{position:relative;isolation:isolate;padding:24px 0 35px}
    .mast .wrap::before{position:absolute;content:"";z-index:-1;right:28px;top:-107px;width:380px;height:380px;border:1px solid #d2e7b737;border-radius:44% 56% 43% 57%;transform:rotate(43deg);box-shadow:0 0 0 25px #ccebb30d,0 0 0 52px #d4ebb50c,0 0 0 79px #cee6b20a;pointer-events:none}
    .mast .wrap::after{position:absolute;content:"";z-index:-1;right:110px;top:-31px;width:236px;height:238px;border:1px solid #d5eeb22e;border-radius:61% 39% 63% 37%;transform:rotate(-20deg);box-shadow:0 0 0 18px #cee6b20c;pointer-events:none}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-size:.85rem;font-weight:700;letter-spacing:.13em;color:#d5e8d5}
    .previous-site{font-size:.86rem;color:#fffef2;text-underline-offset:.3em}
    .mast h1{font-size:clamp(2.2rem,5.8vw,4.15rem);line-height:1.1;letter-spacing:-.04em;margin:24px 0 13px;font-weight:800}
    .lead{color:#d6e7d5;font-size:clamp(.88rem,2vw,1.02rem)}
    .chapter-line{display:flex;flex-wrap:wrap;gap:7px 18px;margin-top:18px;color:#edebcb;font-size:.85rem}
    .chapter-line span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--gold);vertical-align:.18em;margin-right:7px}
    main{padding:24px 0 54px}
    .overview{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:15px 19px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
    .metrics{display:flex;flex-wrap:wrap;gap:10px 25px}
    .metric{white-space:nowrap;color:var(--muted);font-size:.88rem}
    .metric strong{font-size:1.12rem;color:var(--green);margin-right:5px;font-variant-numeric:tabular-nums}
    .button{border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:7px 13px;font-weight:700;white-space:nowrap}
    .button:hover:not(:disabled){background:var(--wash);border-color:#9caf9d}
    .button.primary{background:var(--green);border-color:var(--green);color:#fffef9}
    .button.primary:hover:not(:disabled){background:var(--dark)}
    .button[aria-pressed=true]{background:#dcebd9;border-color:#7a9d82;color:#184738}
    .filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(140px,1.12fr);gap:12px;margin:18px 0}
    .control{min-width:0}
    .control span{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin:0 0 4px 2px}
    .control select,.control input{width:100%;min-height:42px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
    .workspace{display:grid;grid-template-columns:minmax(260px,315px) minmax(0,1fr);gap:17px;align-items:start}
    .panel{background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);min-width:0}
    .browse{padding:13px}
    .browse-heading{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 2px 11px}
    .browse-heading h2{font-size:1.07rem}
    .browse-heading span,.hint{font-size:.81rem;color:var(--muted)}
    .picker-mobile{display:none}
    #question-list{list-style:none;margin:0;padding:0;max-height:565px;overflow:auto;scrollbar-width:thin;scrollbar-color:#97ad9e transparent}
    #question-list li+li{margin-top:4px}
    .list-item{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:9px;padding:9px;display:grid;grid-template-columns:29px 1fr;gap:7px;align-items:start}
    .list-item:hover{background:#f1f4e8}
    .list-item[aria-current=true]{background:#e6efe2;border-color:#99b59a}
    .q-number{font-size:.83rem;font-variant-numeric:tabular-nums;font-weight:750;color:#345e50;padding-top:1px}
    .list-name{font-size:.9rem;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
    .list-meta{display:block;font-size:.73rem;color:var(--muted);margin-top:5px}
    .q-card{overflow:hidden}
    .q-top{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:11px 22px;background:#eaf1e5;border-bottom:1px solid var(--line);flex-wrap:wrap}
    .tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .tag{font-size:.79rem;color:#254c40;border:1px solid #b6cdb7;border-radius:25px;padding:2px 8px;background:#f4f8ee}
    .tag.ref{border:0;background:transparent;font-weight:700;padding-inline:3px}
    .position{font-size:.81rem;font-weight:700;color:var(--muted);white-space:nowrap}
    .q-body{padding:22px}
    #question-heading{font-size:clamp(1.18rem,2.6vw,1.52rem);line-height:1.47;margin-bottom:12px;overflow-wrap:break-word}
    #question-heading:focus{outline:none}
    .question-material{margin:13px 0 17px;background:#f1f4eb;border:1px solid #d4e0d3;border-radius:10px;overflow:auto}
    .question-material .flow{padding:11px 14px;font-size:.93rem;font-weight:700;color:#204b3d;overflow-wrap:anywhere}
    .question-material table{width:100%;border-collapse:collapse;font-size:.9rem;text-align:left}
    .question-material th,.question-material td{padding:7px 12px;border-bottom:1px solid #d5e0d0;min-width:72px}
    .question-material th{background:#e5eee0;color:#234a3d}
    .question-material tr:last-child td{border-bottom:0}
    .fields{display:grid;gap:12px}
    .fields.blank-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,143px),1fr))}
    .field{min-width:0;margin:0;padding:0;border:0}
    .field-title{display:block;font-weight:700;font-size:.9rem;color:#254c40;margin-bottom:5px}
    .field input[type=text],.field textarea{display:block;width:100%;min-height:43px;border:1px solid #a8beb0;border-radius:8px;background:#fbfdf7;padding:8px 10px}
    .field textarea{min-height:90px;resize:vertical}
    .option{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;background:#fcfdf7;line-height:1.45}
    .option+.option{margin-top:7px}
    .option:hover,.option:has(:checked){background:#eaf3e7;border-color:#83a88b}
    .option input{accent-color:var(--green);width:17px;height:17px;margin:0;flex:none}
    .option .letter{background:#e8eee4;color:#345849;border-radius:5px;font-size:.79rem;font-weight:800;width:22px;height:22px;display:grid;place-items:center;flex:none}
    .actions{margin-top:17px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .q-nav{padding:11px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:6px;background:#f9faf3}
    .feedback{background:#f0f5ec;border:1px solid #c3d6c1;border-radius:10px;padding:13px;margin-top:17px}
    .feedback h3{font-size:1rem;margin-bottom:6px;color:var(--green)}
    .feedback ol{margin:0;padding-left:23px}
    .feedback li+li{margin-top:7px}
    .feedback li span{font-size:.82rem;font-weight:800;margin-right:6px}
    .feedback .good{color:#1d6547}.feedback .retry{color:var(--error)}
    .details{border-top:1px solid #c6d8c4;margin-top:11px;padding-top:8px;font-size:.92rem}
    .self-check{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
    .site-footer{margin:16px 2px 0;color:var(--muted);font-size:.8rem}
    .empty{padding:24px}
    .skip{position:absolute;left:10px;top:6px;transform:translateY(-160%);background:var(--paper);color:var(--dark);padding:6px 10px;z-index:2}
    .skip:focus{transform:translateY(0)}
    @media(max-width:780px){
      .workspace{grid-template-columns:1fr;gap:12px}
      .pick-desktop{display:none}
      .picker-mobile{display:block}
      .picker-mobile select{width:100%;padding:7px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
    }
    @media(max-width:560px){
      .wrap{width:calc(100% - 26px)}
      .mast .wrap{padding:19px 0 25px}
      .mast .wrap::before{right:-170px}
      .mast .wrap::after{right:-64px}
      .mast h1{margin-top:19px}
      main{padding-top:13px}
      .overview{padding:11px;flex-wrap:wrap;gap:7px}
      .metrics{gap:3px 11px}
      .metric{font-size:.8rem}
      .metric strong{font-size:1rem}
      .filters{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:12px 0}
      .q-top,.q-nav{padding:9px 12px}
      .q-body{padding:14px 12px}
      .field input,.field textarea,.control select,.control input{font-size:16px}
    }

  <header class="mast">
    <div class="wrap">
      <div class="topline"><span class="brand">高三生物 · 第一段</span><a class="previous-site" href="./chinese-practice.html">原有中文練習站 ↗</a></div>
      <h1>生物練習站</h1>
      <p class="lead">重做測驗與小測，練習同類新題，逐題核對答案。</p>
      <div class="chapter-line"><span>神經調節</span><span>體液調節</span><span>免疫調節</span><span>植物生命活動的調節</span></div>
    </div>
  </header>
  <main class="wrap">
    <section class="overview" aria-label="練習進度">
      <div class="metrics" id="metrics" aria-live="polite"></div>
      <button type="button" class="button" id="missed-toggle" aria-pressed="false">只看錯題</button>
    </section>
    <section class="filters" aria-label="篩選題目">
      <label class="control"><span>課題</span><select id="topic"></select></label>
      <label class="control"><span>題型</span><select id="type"></select></label>
      <label class="control"><span>題目來源</span><select id="source"></select></label>
      <label class="control"><span>搜尋</span><input id="search" type="search" placeholder="例如：血糖、突觸、TSH"></label>
    </section>
    <div class="workspace">
      <aside class="panel browse" aria-labelledby="bank-heading">
        <div class="browse-heading"><h2 id="bank-heading">題目清單</h2><span id="match-count" aria-live="polite"></span><button type="button" id="random" class="button">隨機抽題</button></div>
        <label class="picker-mobile"><span class="hint">跳到題目</span><select id="picker"></select></label>
        <div class="pick-desktop"><ul id="question-list"></ul></div>
      </aside>
      <section class="panel q-card" id="practice" aria-label="作答區"></section>
    </div>
    <p class="site-footer">原卷題目按圖片整理，部分題幹、圖表或有歧義的選項已重述。作答與錯題記錄保存在目前的瀏覽器。</p>
  </main>
  <noscript><p class="wrap">請開啟 JavaScript 使用練習站。</p></noscript>
  <script>
const bank = [];
const topics = ['神經調節', '體液調節', '免疫調節', '植物調節'];
const types = ['選擇', '填充', '問答', '綜合', '判斷'];
const sources = ['測驗一', '測驗二', '免疫小測', '新增練習'];

function add(id, topic, type, ref, stem, fields, explanation, data) {
  const source = sources[['a','b','c','n'].indexOf(id[0])];
  bank.push({ id, topic: topics[topic], type, source, ref, stem, fields, explanation, data });
}
const blank = (label, ...answers) => ({ label, answers:answers.flatMap(a=>a.split('|')) });
const list = (answers) => answers.map((a,i) => blank(String(i+1), a));
const choice = (id,t,ref,stem,options,correct,explanation,data) =>
  add(id,t,'選擇',ref,stem,[{label:'選出一個答案',options,correct}],explanation,data);
const judge = (id,t,ref,stem,correct,explanation) =>
  add(id,t,'判斷',ref,stem,[{label:'判斷正誤',options:['正確','錯誤'],correct:correct?0:1}],explanation);
const fill = (id,t,ref,stem,answers,explanation) =>
  add(id,t,'填充',ref,stem,list(answers),explanation);
const long = (label, model) => ({ label, model });
const written = (id,t,ref,stem,parts,explanation,data) =>
  add(id,t,'問答',ref,stem,parts,explanation,data);
const caseQ = (id,t,ref,stem,parts,explanation,data) =>
  add(id,t,'綜合',ref,stem,parts,explanation,data);

fill('a-f1',0,'填充 1–5','神經系統分為①、②兩部分。前者的腦位於③，脊髓位於④。神經系統結構與功能的基本單位為⑤。',['中樞神經系統|中樞','外周神經系統|周圍神經系統|外周|周圍','顱腔','椎管|脊椎管','神經元|神經細胞'],'中樞神經系統包括腦和脊髓，外周神經系統包括腦神經、脊神經等。');
fill('a-f2',0,'填充 6–10','按興奮傳遞順序，寫出反射弧的五個基本部分。',['感受器','傳入神經|感覺神經|傳入神經元','神經中樞|中樞','傳出神經|運動神經|傳出神經元','效應器'],'效應器由傳出神經末梢及其支配的肌肉或腺體等構成。');
fill('a-f3',0,'填充 11–12','自主神經系統由哪兩部分組成？先寫使心跳加快的一方，再寫使心跳減慢的一方。',['交感神經|交感神經系統','副交感神經|副交感神經系統'],'兩者對許多內臟器官的作用方向通常相反。');
fill('a-f4',0,'填充 13–15','沿典型化學突觸傳遞方向，順序寫出其三個結構。',['突觸前膜','突觸間隙','突觸後膜'],'遞質由突觸前膜一側釋放，經突觸間隙與後膜受體結合。');
choice('a-c1',0,'選擇 1','哪一項不屬於神經遞質？',['多巴胺','腦內啡','乙醯膽鹼','甲狀腺激素'],3,'多巴胺、腦內啡和乙醯膽鹼均可在神經系統中傳遞訊號。原卷 D 項用語有歧義，這裡改成明確的激素名稱。');
choice('a-c2',1,'選擇 2','有些神經分泌細胞既能傳導興奮，也能合成並分泌激素。典型例子位於哪裡？',['大腦皮層','下丘腦','小腦','脊髓'],1,'下丘腦的神經分泌細胞可合成釋放激素和抗利尿激素等。原卷選項只列垂體，這裡按課本修正。');
choice('a-c3',0,'選擇 3','以下哪項最能體現人腦特有的高級功能？',['尋找物件','用語言表達意思','看見光線','聽見聲音'],1,'聽、說、讀、寫所涉及的語言功能是人腦特有的高級功能。');
choice('a-c4',0,'選擇 4','調節人體生理活動的最高級中樞在哪裡？',['腦幹','大腦皮層','小腦','脊髓'],1,'大腦皮層是最高級中樞，可調控部分低級中樞的活動。');
choice('a-c5',0,'選擇 5','神經系統結構和功能的基本單位是甚麼？',['神經元','反射弧','神經衝動','神經纖維'],0,'神經元通常包括細胞體、樹突和軸突。');
choice('a-c6',0,'選擇 6','神經纖維在靜息，以及動作電位去極化峰值時，膜內外相對電位依次是甚麼？',['內正外負、內負外正','內負外正、內正外負','內負外正、內負外正','內正外負、內正外負'],1,'靜息時膜內相對為負。達閾值後 Na⁺ 快速內流，去極化峰值時可使膜內相對為正。');
choice('a-c7',1,'選擇 7','以下哪個過程可使血糖降低？',['消化吸收食物中的糖類','促進肌肉合成糖原','將非糖物質轉成葡萄糖','分解肝糖原並輸出葡萄糖'],1,'合成肌糖原消耗進入肌細胞的葡萄糖。其餘選項使血糖來源增加。');
choice('a-c8',1,'選擇 8','以下哪項有關體溫調節的敘述正確？',['體溫只受神經調節','下丘腦只有冷覺感受器','維持體溫的熱量主要來自體內代謝','甲狀腺激素與腎上腺素在產熱上相互拮抗'],2,'體溫由產熱和散熱平衡維持，受神經和體液共同調節。');
choice('a-c9',1,'選擇 9','「三多一少」中的「三多」不包括哪項？',['多食','多尿','多飲','多睡'],3,'「三多」是多食、多尿、多飲，「一少」是體重減輕。');
choice('a-c10',1,'選擇 10','幼年嚴重缺乏甲狀腺激素，課本常以哪項描述其發育異常？',['生長激素不足造成的侏儒症','巨人症','呆小症（舊稱）','單純性甲狀腺腫'],2,'幼年甲狀腺激素嚴重不足會影響生長及神經系統發育。');
caseQ('a-x1',1,'綜合 1','根據內分泌腺的位置辨認構造，再回答激素題。',[...list(['垂體|腦垂體','甲狀腺','腎上腺','胰島','卵巢','睪丸|睾丸']).map((p,i)=>({...p,label:'位置 '+(i+1)})),blank('7. 在青春期增多、促進第二性徵的激素類別','性激素|性'),blank('8. 上述激素分泌增加的時期','青春期'),blank('9. 與嬰幼兒腦發育密切相關的腺體編號','2|②|二'),blank('10. 該腺體的名稱','甲狀腺'),blank('11. 該腺體分泌、同時可促進代謝的激素','甲狀腺激素|甲狀腺素')],'④要寫胰島。胰島是胰腺內分泌部分，胰腺還有分泌胰液的外分泌部分。',{headers:['標示','位置'],rows:[['①','下丘腦下方'],['②','頸部、氣管前方'],['③','兩側腎臟上方'],['④','胰臟內的細胞團'],['⑤','女性骨盆腔內'],['⑥','男性陰囊內']]});
caseQ('a-x2',0,'綜合 2','三個神經元均為興奮性，箭嘴為突觸傳遞方向。A 在②軸突，C 在①軸突，B 是②通往骨骼肌的神經肌肉接頭。',[

fill('b-f5',2,'填充 10–12','「艾滋病」對應英文簡稱①。引起此病的病毒全稱為②，英文簡稱是③。',['AIDS','人類免疫缺陷病毒|人類免疫缺乏病毒|人類免疫缺損病毒','HIV'],'HIV 感染會削弱免疫功能，主要影響輔助性 T 細胞。');
fill('b-f6',2,'填充 13–15','按課本分類，傳統全病原體疫苗可包括哪兩類？①使病原體失去感染能力；②使病原體致病能力下降。另寫出人體組織相容性抗原的中文名稱③。',['滅活|不活化|滅活疫苗','減毒|弱化|減毒疫苗','人類白細胞抗原|人類白血球抗原|人類白血細胞抗原'],'疫苗種類還包括亞單位等。HLA 是人類白細胞抗原，與移植配型有關。');

],'光可作為發育訊號，也提供光合作用所需能量。題目問調節時，優先寫訊號的作用。');
caseQ('n-31',3,'扦插實驗','同一種植物的插條分組，只改變生長調節劑濃度，其餘條件相同。以下是一次預實驗的平均結果。',[
  blank('1. 哪組是空白對照？','A|A組|甲|濃度0|0'),

],'只能說 C 是已測組別中的最佳。D 比空白對照低，說明過高濃度下可能抑制生根。',{headers:['組別','濃度（mg/L）','平均根數'],rows:[['A','0','4'],['B','0.2','7'],['C','1.0','11'],['D','5.0','2']]});
caseQ('n-32',3,'胚芽鞘實驗','下列處理同樣接受左側單側光，其他條件相同。請預測生長方向並據此推理。',[
  blank('1. 甲主要向哪側彎曲？','左|左側|向左|光源|向光|向光源|向左彎曲'),

  blank('3. 丙只把尖端下方遮光，尖端仍能感光，主要向哪側彎曲？','左|左側|向左|光源|向光|向光源|向左彎曲'),
  long('4. 比較乙、丙，指出感受單側光的主要部位。','乙只遮尖端即失去向光彎曲，丙遮尖端以下仍可向光彎曲，說明感受單側光的主要部位是胚芽鞘尖端。')
],'感光主要在尖端，彎曲的生長部位主要在尖端以下。',{headers:['組別','處理'],rows:[['甲','完整胚芽鞘'],['乙','尖端套不透光小帽'],['丙','遮住尖端下方，尖端露出']]});

const $ = (id) => document.getElementById(id);
const byId = new Map(bank.map((q, index) => [q.id, { ...q, number:index+1 }]));
const storageKey = 'biology-practice-test-v1';
let records = {};
try { records = JSON.parse(localStorage.getItem(storageKey)) || {}; } catch { /* Storage may be blocked. */ }
let active = new URLSearchParams(location.search).get('q');
let missedOnly = false;
let visible = [];
const filters = ['topic','type','source'];
const labels = { '填充':'填充題', '選擇':'選擇題', '問答':'問答題', '綜合':'綜合題', '判斷':'判斷題' };
const escapes = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => escapes[c]);
const normalize = (s) => String(s ?? '').normalize('NFKC').toLowerCase().replace(/[\s，,。；;、：:！!？?（）()「」→➡－\-]/g,'');
const isMissed = (r) => Boolean(r && r.checked && (r.wrong || r.self === 'retry'));
const isPending = (r) => Boolean(r && r.checked && r.needsSelf && !r.self);
const defaultRecord = () => ({ draft:{}, checked:false, wrong:false, needsSelf:false, self:null });

function save() {
  try { localStorage.setItem(storageKey, JSON.stringify(records)); } catch { /* Keep progress for this visit. */ }
}

function setSelect(id, options, first) {
  $(id).innerHTML = '<option value="">' + esc(first) + '</option>' + options.map(
    (o) => '<option value="' + esc(o) + '">' + esc(labels[o] || o) + '</option>'
  ).join('');
}

function renderMetrics() {
  const valid = bank.map((q) => records[q.id]).filter(Boolean);
  $('metrics').innerHTML = [
    [bank.length,'題組'],[valid.filter(r=>r.checked).length,'已核對'],
    [valid.filter(isMissed).length,'錯題'],[valid.filter(isPending).length,'待自評']
  ].map(([n,label]) => '<span class="metric"><strong>' + n + '</strong>' + label + '</span>').join('');
  $('missed-toggle').setAttribute('aria-pressed', String(missedOnly));
}

function updateVisible() {
  const selected = filters.map((key) => [key,$(key).value]);
  const query = normalize($('search').value);
  visible = [...byId.values()].filter((q) => {
    const text = [q.stem,q.ref,q.topic,q.source,labels[q.type],...q.fields.map(f=>f.label)].join(' ');
    return (!missedOnly || isMissed(records[q.id]))
      && selected.every(([key, val])=>!val || q[key] === val)
      && (!query || normalize(text).includes(query));
  });
  if (!visible.some((q)=>q.id===active)) active=visible[0]?.id ?? null;
}

function renderList() {
  const list = $('question-list');
  const oldScroll = list.scrollTop;
  const status = (q) => {
    const r = records[q.id];
    if (isMissed(r)) return ' · 待重練';
    if (isPending(r)) return ' · 待自評';
    return r?.checked ? ' · 已核對' : '';
  };
  $('match-count').textContent = visible.length + ' 題';
  $('random').disabled = visible.length < 2;
  $('picker').disabled = !visible.length;
  $('picker').innerHTML = visible.length ? visible.map((q)=>
    '<option value="' + q.id + '"' + (active===q.id?' selected':'') + '>' + q.number + ' · ' + esc(q.ref) + ' · ' + esc(q.stem.slice(0,38)) + '</option>'
  ).join('') : '<option>沒有符合的題目</option>';
  list.innerHTML = visible.map((q)=>
    '<li><button type="button" class="list-item" data-open="' + q.id + '" aria-current="' + (active===q.id) + '"><span class="q-number">' + q.number +
    '</span><span><span class="list-name">' + esc(q.stem) + '</span><span class="list-meta">' + esc(q.source + ' · ' + q.ref + status(q)) + '</span></span></button></li>'
  ).join('');
  list.scrollTop = oldScroll;
  const current = list.querySelector('[aria-current=true]');
  if (current && list.clientHeight > 0) {
    const activeTop = current.getBoundingClientRect().top - list.getBoundingClientRect().top;
    if (activeTop < 0) list.scrollTop += activeTop;
    if (activeTop + current.offsetHeight > list.clientHeight) list.scrollTop += activeTop + current.offsetHeight - list.clientHeight;
  }
}

function material(data) {
  if (!data) return '';
  if (data.lines) return '<div class="question-material"><div class="flow">' + data.lines.map(esc).join('<br>') + '</div></div>';
  const cells = (a,tag) => a.map((s) => '<' + tag + (tag==='th'?' scope="col"':'') + '>' + esc(s) + '</' + tag + '>').join('');
  return '<div class="question-material"><table aria-label="題目資料"><thead><tr>' + cells(data.headers,'th') +
    '</tr></thead><tbody>' + data.rows.map(r=>'<tr>'+cells(r,'td')+'</tr>').join('') + '</tbody></table></div>';
}

function renderField(field, i, value) {
  const label = esc(field.label);
  const key = 'field-' + i;
  if (field.options) {
    return '<fieldset class="field"><legend class="field-title">' + label + '</legend>' +
      field.options.map((option, j) => '<label class="option"><input type="radio" name="' + key + '" data-part="' + i + '" value="' + j +
        '"' + (value === String(j) ? ' checked' : '') + '><span class="letter">' + String.fromCharCode(65+j) + '</span><span>' + esc(option) + '</span></label>'
      ).join('') + '</fieldset>';
  }
  const control = field.model
    ? '<textarea id="' + key + '" data-part="' + i + '" placeholder="輸入你的答案">' + esc(value) + '</textarea>'
    : '<input type="text" id="' + key + '" data-part="' + i + '" value="' + esc(value) + '" autocomplete="off" placeholder="輸入答案">';
  return '<div class="field"><label class="field-title" for="' + key + '">' + label + '</label>' + control + '</div>';
}

function isCorrect(field, entry) {
  if (field.options) return entry === String(field.correct);
  return field.answers.some((answer)=>normalize(answer)===normalize(entry));
}

function outputFeedback(q, record) {
  if (!record.checked || record.working) return '';
  const answers = record.submitted || {};
  const automatic = q.fields.filter(f=>!f.model).length;
  const correct = q.fields.filter((f,i)=>!f.model && isCorrect(f,answers[i])).length;
  const title = automatic ? '客觀題 ' + correct + '／' + automatic + ' 正確' : '參考答案與得分重點';
  const lines = q.fields.map((f,i) => {
    const good = !f.model && isCorrect(f,answers[i]);
    const label = f.model ? '參考' : good ? '正確' : answers[i]?.trim() ? '需修正' : '未作答';
    const solution = f.model || (f.options ? f.options[f.correct] : f.answers[0]);
    return '<li><span class="' + (f.model || good ? 'good' : 'retry') + '">' + label + '</span><strong>' + esc(f.label) +
      '</strong>　' + esc(solution) + '</li>';
  });
  return '<section class="feedback" id="feedback" tabindex="-1"><h3>' + title + '</h3><ol>' + lines.join('') + '</ol>' +
    '<p class="details">' + esc(q.explanation) + '</p>' + (record.needsSelf ?
      '<div class="self-check"><button type="button" class="button" data-grade="ok" aria-pressed="' + (record.self==='ok') +
      '">重點寫齊</button><button type="button" class="button" data-grade="retry" aria-pressed="' + (record.self==='retry') +
      '">標記再練</button><span class="hint">請按參考答案自評問答部分。</span></div>' : '') + '</section>';
}

function renderQuestion() {
  const panel = $('practice');
  const index = visible.findIndex(q=>q.id===active);
  if (index < 0) {
    panel.innerHTML = '<div class="empty"><h2>沒有符合的題目</h2><p class="hint">調整篩選、清除搜尋或關閉錯題模式。</p><div class="actions"><button type="button" data-reset class="button">清除篩選</button></div></div>';
    return;
  }
  const q = visible[index];
  const record = records[q.id] || defaultRecord();
  const shortGrid = q.type === '填充' || (q.type === '綜合' && q.fields.every(f=>/^\d$/.test(f.label)));
  panel.innerHTML =
    '<div class="q-top"><div class="tags"><span class="tag">' + esc(q.source) + '</span><span class="tag">' + esc(labels[q.type]) +
    '</span><span class="tag ref">' + esc(q.ref) + '</span></div><span class="position">第 ' + (index+1) + '／' + visible.length + ' 題</span></div>' +
    '<div class="q-body"><h2 id="question-heading" tabindex="-1">' + esc(q.stem) + '</h2>' + material(q.data) +
    '<form id="answer-form" aria-labelledby="question-heading"><div class="fields' + (shortGrid ? ' blank-grid' : '') + '">' +
    q.fields.map((f,i)=>renderField(f,i,record.draft[i])).join('') +
    '</div><div class="actions"><button class="button primary" type="submit">核對答案</button>' +
    '<button class="button" type="button" data-retry>重做此題</button><span id="input-notice" class="hint" role="status"></span></div></form>' +
    outputFeedback(q,record) + '</div><nav class="q-nav" aria-label="換題"><button class="button" type="button" data-move="-1"' +
    (index===0?' disabled':'') + '>← 上一題</button><button class="button" type="button" data-move="1"' +
    (index===visible.length-1?' disabled':'') + '>下一題 →</button></nav>';
}

function renderAll() {
  renderMetrics();
  renderList();
  renderQuestion();
}

function openQuestion(id) {
  if (!visible.some(q=>q.id===id)) return;
  active = id;
  updateVisible();
  renderList();
  renderQuestion();
  $('question-heading')?.focus();
}

function applyFilters() {
  updateVisible();
  renderAll();
}

setSelect('topic',topics,'全部課題');
setSelect('type',types,'全部題型');
setSelect('source',sources,'全部來源');
filters.forEach((key)=>$(key).addEventListener('change',applyFilters));
$('search').addEventListener('input',applyFilters);
$('missed-toggle').addEventListener('click',()=>{
  missedOnly = !missedOnly;
  applyFilters();
});
$('picker').addEventListener('change',(e)=>openQuestion(e.target.value));
$('random').addEventListener('click',()=>{
  const options=visible.filter(q=>q.id!==active);
  if (options.length) openQuestion(options[Math.floor(Math.random()*options.length)].id);
});
$('question-list').addEventListener('click',(e)=>{
  const btn=e.target.closest('[data-open]');
  if (btn) openQuestion(btn.dataset.open);
});
$('practice').addEventListener('input',(e)=>{
  if (!e.target.matches('[data-part]') || !active) return;
  const r=records[active] ||= defaultRecord();
  r.draft[e.target.dataset.part]=e.target.value;
  $('input-notice').textContent = r.checked ? '答案有修改，可再核對。' : '';
  save();
});
$('practice').addEventListener('submit',(e)=>{
  if (e.target.id!=='answer-form') return;
  e.preventDefault();
  const q=byId.get(active);
  const r=records[active] ||= defaultRecord();
  if (!Object.values(r.draft).some((s)=>s.trim())) {
    $('input-notice').textContent='請先作答至少一小題。';
    return;
  }
  r.submitted={...r.draft};
  r.checked=true;
  r.needsSelf=q.fields.some(f=>f.model);
  r.wrong=q.fields.some((f,i)=>!f.model && !isCorrect(f,r.submitted[i]));
  r.self=null;
  r.working=false;
  save();
  renderAll();
  $('feedback')?.focus();
});
$('practice').addEventListener('click',(e)=>{
  const button=e.target.closest('button');
  if (!button) return;
  if (button.hasAttribute('data-reset')) {
    filters.forEach((key)=>{$(key).value='';});
    $('search').value='';
    missedOnly=false;
    applyFilters();
    return;
  }
  if (button.dataset.grade) {
    records[active].self=button.dataset.grade;
    save();
    renderAll();
    $('feedback')?.focus();
    return;
  }
  if (button.hasAttribute('data-retry')) {
    const r=records[active] ||= defaultRecord();
    r.draft={};
    r.working=true;
    save();
    const form=$('answer-form');
    form.querySelectorAll('[data-part]').forEach((control)=>{
      if (control.type==='radio') control.checked=false;
      else control.value='';
    });
    $('feedback')?.remove();
    $('input-notice').textContent='已清空輸入，可重新作答。';
    form.querySelector('[data-part]')?.focus();
    return;
  }
  if (button.dataset.move) {
    const index=visible.findIndex(q=>q.id===active)+Number(button.dataset.move);
    if (visible[index]) openQuestion(visible[index].id);
  }
});

applyFilters();

  </script>
