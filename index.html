<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="高三中文第一段選擇題練習。課文、文學常識、名句、語文基礎和閱讀理解，附答案解析和錯題簿。">
  <meta name="theme-color" content="#18443b">
  <title>高三中文練習站</title>
  <style>
:root {
  color-scheme: light;
  --ink: #192e29;
  --muted: #566760;
  --green: #1d594b;
  --green-dark: #19463c;
  --green-soft: #e5f0e9;
  --paper: #f6f6ef;
  --white: #fffefa;
  --line: #dde3da;
  --red: #934531;
  --red-soft: #fbede5;
  --serif: 'Noto Serif TC', 'Songti TC', PMingLiU, serif;
  --sans: system-ui, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  font: 100%/1.55 var(--sans);
  color: var(--ink);
  background: var(--paper);
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-width: 300px; }
button, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
button, a, select { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid #ad682f; outline-offset: 4px; }
[hidden] { display: none !important; }
h1, h2, p, ul { margin: 0; }
.wrap { width: min(1184px, calc(100% - 64px)); margin-inline: auto; }
.skip-link { position: fixed; z-index: 5; left: 16px; top: -100px; background: var(--white); color: var(--ink); padding: 10px 15px; }
.skip-link:focus { top: 12px; }
.site-header { background: var(--white); border-bottom: 1px solid var(--line); }
.header-inner { display: flex; align-items: center; justify-content: space-between; min-height: 69px; gap: 14px; }
.brand { display: inline-flex; align-items: center; gap: 11px; background: none; padding: 0; border: 0; color: var(--ink); white-space: nowrap; font-size: 1rem; letter-spacing: .06em; font-weight: 750; }
.seal { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; color: #fff9ef; background: var(--red); font: 700 1.2rem var(--serif); }
.top-nav { display: flex; align-items: center; gap: 8px; }
.top-nav button { color: var(--muted); background: transparent; padding: 7px 13px; border: 1px solid transparent; border-radius: 7px; white-space: nowrap; font-size: .92rem; }
.top-nav button:hover, .top-nav button[aria-current] { color: var(--green-dark); background: var(--green-soft); }
.top-nav button[aria-current] { font-weight: 700; }
.counter { margin-left: 6px; display: inline-block; min-width: 18px; padding-inline: 4px; border-radius: 8px; background: var(--green-dark); color: white; font-size: .72rem; font-variant-numeric: tabular-nums; }

.hero { position: relative; isolation: isolate; display: flex; align-items: end; justify-content: space-between; gap: 24px; overflow: hidden; margin: 28px 0 25px; padding: 32px 40px 34px; min-height: 208px; border-radius: 16px; background: linear-gradient(110deg, #153d34 0%, #1c5144 72%, #23604e 100%); color: #fffcf0; }
.hero-copy { position: relative; }
.eyebrow { display: flex; align-items: center; gap: 8px; color: #efe2bc; font-size: .87rem; font-weight: 660; letter-spacing: .13em; }
.eyebrow span { width: 17px; height: 1px; background: #e8c483; }
h1 { font: 700 clamp(2.25rem, 5vw, 3.45rem)/1.18 var(--serif); letter-spacing: .09em; padding-top: 8px; }
.hero-copy > p:last-child { margin-top: 12px; color: #e0ede5; font-size: .98rem; }
.bank-size { position: relative; display: grid; justify-items: center; flex: none; align-self: end; min-width: 114px; padding: 9px 14px 10px; border: 1px solid #c8dfcf49; border-radius: 10px; background: #163d3366; color: #e9eddd; font-size: .83rem; }
.bank-size strong { color: #faefda; font: 700 1.8rem/1.25 var(--serif); font-variant-numeric: tabular-nums; }
.hero-art { position: absolute; inset: 0 100px 0 auto; z-index: -1; width: min(49%, 520px); opacity: .6; pointer-events: none; }
.hero-art i { position: absolute; top: -96px; right: calc(var(--offset, 0) * 27px); width: calc(245px + var(--offset, 0) * 71px); height: calc(245px + var(--offset, 0) * 71px); border: 1px solid #c9df9f32; border-radius: 45% 55% 54% 46%; transform: rotate(-20deg); }
.hero-art i:nth-child(2) { --offset: 1; }
.hero-art i:nth-child(3) { --offset: 2; }
.hero-art i:nth-child(4) { --offset: 3; }
.hero-art i:nth-child(5) { --offset: 4; }

.layout { display: grid; grid-template-columns: minmax(240px, 284px) minmax(0, 1fr); gap: 22px; align-items: start; }
.sidebar { display: grid; gap: 17px; }
.panel { background: var(--white); border: 1px solid var(--line); border-radius: 13px; box-shadow: 0 2px 2px #233c2a04; }
.topic-panel, .stats-panel { padding: 18px; }
.sidebar h2 { font-size: .96rem; font-weight: 780; margin: 0 0 12px; }
.topic-list { display: grid; gap: 4px; }
.topic { display: flex; align-items: center; gap: 9px; justify-content: space-between; min-height: 42px; width: 100%; text-align: left; border: 1px solid transparent; border-radius: 8px; padding: 7px 10px; color: var(--muted); background: none; font-size: .9rem; }
.topic:hover { background: #f0f4ed; }
.topic[aria-pressed="true"] { background: var(--green-soft); color: #154637; border-color: #d3e6d9; font-weight: 750; }
.topic-count { color: #52675a; font-size: .78rem; font-variant-numeric: tabular-nums; }
.filter-label { display: block; margin: 13px 0 5px; font-size: .82rem; color: var(--muted); }
.filter { width: 100%; min-height: 39px; padding: 6px 32px 6px 9px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: var(--white); font-size: .88rem; }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; text-align: center; margin-bottom: 10px; }
.stats-grid > div { background: #f3f5ef; border-radius: 7px; padding: 6px 2px 8px; }
.stat-number { display: block; color: var(--green-dark); font-size: 1.19rem; line-height: 1.35; font-weight: 780; font-variant-numeric: tabular-nums; }
.stat-label { color: var(--muted); font-size: .74rem; white-space: nowrap; }
.text-button { border: 0; background: transparent; padding: 3px 0; color: var(--green); font-size: .86rem; text-decoration: underline; text-underline-offset: 3px; }
.text-button:hover { color: var(--red); }

.practice { min-width: 0; }
.quiz-panel, .result-panel, .review-panel { padding: 24px 29px; }
.quiz-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.quiz-head h2, .result-panel h2, .review-panel h2 { font-size: 1.2rem; font-weight: 780; }
.quiz-progress { color: var(--muted); font-size: .86rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.progress-bar { display: block; width: 100%; margin: 11px 0 16px; height: 5px; border: 0; border-radius: 6px; overflow: hidden; background: #e9eee7; accent-color: var(--green); }
.progress-bar::-webkit-progress-bar { background: #e9eee7; }
.progress-bar::-webkit-progress-value { border-radius: 6px; background: #38836d; }
.progress-bar::-moz-progress-bar { border-radius: 6px; background: #38836d; }
.question-line { margin: 0 0 15px; }
.question-topic { display: inline-block; max-width: 100%; color: var(--green-dark); border: 1px solid #e1eae0; background: #edf3eb; border-radius: 5px; padding: 2px 7px; font-size: .81rem; font-weight: 700; margin-bottom: 8px; }
.question-title { font-size: clamp(1.12rem, 2.15vw, 1.37rem); font-weight: 760; line-height: 1.65; overflow-wrap: anywhere; }
.passage { margin-bottom: 15px; padding: 12px 15px; border-left: 3px solid #a78b58; border-radius: 0 7px 7px 0; background: #f5f0e5; }
.passage > summary { cursor: pointer; font-weight: 680; color: #624b2a; }
.passage > p { margin-top: 6px; line-height: 1.75; }
.choices { display: grid; gap: 7px; }
.choice { position: relative; display: flex; align-items: center; gap: 11px; min-height: 46px; padding: 7px 12px; background: #fffefa; border: 1px solid #dce4d9; border-radius: 8px; cursor: pointer; }
.choice:hover, .choice:has(input:focus-visible) { border-color: #6c9788; }
.choice:has(input:focus-visible) { outline: 2px solid #ad682f; outline-offset: 2px; }
.choice:has(input:checked) { background: #e9f3ee; border-color: #498370; }
.choice:has(input:disabled) { cursor: default; }
.choice.is-right { background: var(--green-soft); border-color: #76a492; }
.choice.is-wrong { background: var(--red-soft); border-color: #ca8c79; }
.choice input { position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0; }
.choice-letter { display: grid; place-items: center; flex: 0 0 29px; height: 29px; border: 1px solid #d6e2d6; border-radius: 6px; color: #35574d; background: #f2f5ef; font-size: .78rem; font-weight: 750; }
.choice:has(input:checked) .choice-letter, .choice.is-right .choice-letter { color: #fff; background: var(--green); border-color: var(--green); }
.choice.is-wrong .choice-letter { color: #fff; background: var(--red); border-color: var(--red); }
.choice-text { flex: 1; line-height: 1.5; overflow-wrap: anywhere; }
.choice-status { color: var(--green-dark); font-weight: 730; font-size: .76rem; flex: none; }
.is-wrong .choice-status { color: var(--red); }
.feedback { background: #eff5ec; outline-offset: 3px; border-left: 3px solid #568c6a; border-radius: 0 8px 8px 0; margin-top: 14px; padding: 10px 12px; color: #183f31; }
.feedback.wrong { background: var(--red-soft); border-color: #b96a4e; color: #622a1c; }
.feedback p { margin-top: 3px; }
.quiz-actions { margin-top: 16px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.primary, .secondary { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 8px 14px; border-radius: 8px; font-size: .9rem; font-weight: 700; }
.primary { background: var(--green-dark); border: 1px solid var(--green-dark); color: white; }
.primary:hover { background: #266352; }
.primary:disabled { background: #e2e9e0; color: #606d62; border-color: #e2e9e0; }
.secondary { background: var(--white); border: 1px solid #d2dfd2; color: var(--green-dark); }
.secondary:hover { background: #ecf3eb; }
.secondary:disabled { border-color: #e4e9e2; color: #6a776e; background: #f8f8f3; }
.question-index { margin-top: 15px; padding-top: 13px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; }
.question-index button { display: grid; place-items: center; min-width: 32px; height: 32px; border: 1px solid #dce5da; border-radius: 6px; background: #f4f6ef; color: var(--muted); font-size: .79rem; }
.question-index button[aria-current] { border: 2px solid var(--green); color: var(--green-dark); font-weight: 750; }
.question-index button[data-outcome="right"] { background: #e5efe5; color: var(--green-dark); }
.question-index button[data-outcome="wrong"] { background: var(--red-soft); color: var(--red); }
.question-index button:disabled { background: transparent; color: #69766d; }

.result-intro, .review-intro, .empty-review { margin: 8px 0 16px; color: var(--muted); }
.score-banner { display: flex; align-items: center; gap: 16px; background: #eaf2e8; padding: 13px 16px; border-radius: 9px; margin: 15px 0; }
.score-banner strong { color: var(--green-dark); font: 700 2.25rem/1.1 var(--serif); }
.result-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.answer-list { list-style: none; padding: 0; }
.answer-list li { border-top: 1px solid var(--line); padding: 11px 0; }
.answer-list summary { cursor: pointer; font-weight: 670; }
.answer-list p { margin: 7px 0 0; color: var(--muted); }
.list-marker { color: var(--green); margin-right: 5px; font-size: .84rem; }
.list-marker.wrong { color: var(--red); }
footer { display: flex; justify-content: space-between; gap: 12px; padding: 22px 0 26px; color: var(--muted); font-size: .8rem; }
.no-js { text-align: center; padding: 16px; }

@media (max-width: 800px) {
  .wrap { width: calc(100% - 38px); }
  .layout { grid-template-columns: 212px minmax(0, 1fr); gap: 14px; }
  .quiz-panel, .result-panel, .review-panel { padding: 19px; }
  .hero { padding-inline: 28px; }
  .topic-panel, .stats-panel { padding: 13px; }
}

@media (max-width: 620px) {
  .wrap { width: calc(100% - 24px); }
  .header-inner { min-height: 56px; }
  .seal { width: 30px; height: 30px; }
  .brand { gap: 7px; font-size: .88rem; }
  .top-nav { gap: 3px; }
  .top-nav button { padding-inline: 8px; font-size: .86rem; }
  .hero { margin: 14px 0 12px; min-height: auto; padding: 18px 15px; gap: 8px; border-radius: 11px; }
  .hero h1 { font-size: clamp(1.72rem, 7vw, 2.35rem); letter-spacing: .04em; }
  .hero-copy > p:last-child { margin-top: 6px; font-size: .8rem; }
  .eyebrow { font-size: .73rem; }
  .bank-size { padding: 5px 7px; min-width: 64px; font-size: .66rem; }
  .bank-size strong { font-size: 1.28rem; }
  .hero-art { inset-inline-end: 60px; }
  .layout, .sidebar { display: contents; }
  .topic-panel { margin-bottom: 11px; padding: 10px; }
  .topic-panel h2 { font-size: .83rem; margin-bottom: 6px; }
  .topic-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
  .topic { justify-content: center; text-align: center; min-height: 36px; padding: 5px 2px; font-size: .8rem; }
  .topic-count, .stats-panel { display: none; }
  .filter-label { margin-top: 8px; }
  .quiz-panel, .result-panel, .review-panel { padding: 14px; }
  .question-title { font-size: 1.08rem; }
  .choice { padding: 7px 8px; gap: 7px; }
  .choice-text { font-size: .95rem; }
  .choice-letter { flex-basis: 26px; height: 26px; }
  .choice-status { font-size: .7rem; }
  footer { font-size: .72rem; padding: 15px 0 20px; }
}
</style>
</head>

  <header class="site-header">
    <div class="header-inner wrap">
      <button type="button" class="brand" data-view="practice" aria-label="返回中文練習">

      <nav class="top-nav" aria-label="網站導覽">

  <div class="wrap">
    <section class="hero" aria-labelledby="site-title">

        <p class="eyebrow"><span aria-hidden="true"></span>高三・第一段</p>

  <noscript><p class="no-js">請開啟 JavaScript 後使用選擇題練習。</p></noscript>
  <script>
const classical = [
  ['xiang-shu', '《相鼠》用鼠的皮、齒、體與人的儀、止、禮作對照。這種寫法的主要作用是甚麼？', ['借鼠反襯人無禮，語氣尖銳', '借鼠自比，表達不願入仕', '描寫鼠的習性，勸人愛護動物', '用鼠比喻隱士，表達對山林的嚮往'], '三章都先說鼠尚有皮、齒、體，再責人失去做人應有的禮儀。'],
  ['xiang-shu', '「人而無止，不死何俟？」中的「俟」應怎樣解釋？', ['等待', '侍奉', '畏懼', '預備'], '「俟」是等待。「何俟」即「俟何」，是疑問代詞作賓語而前置。'],
  ['xiang-shu', '《相鼠》三章末句以反問斥責無禮的人。以下哪項最能概括全詩的語調？', ['憤激譏刺', '溫婉勸勉', '低迴悼念', '歡快慶賀'], '強烈的反問一再出現，把對無禮者的厭惡和責斥逐章推出。'],
  ['wu-yi', '《無衣》三章末句由「同仇」、「偕作」寫到「偕行」。這樣安排有甚麼效果？', ['從同仇敵愾寫到一同起身、出征', '從一同出征寫到戰後分道揚鑣', '從軍中缺衣寫到歸家重聚', '從個人請戰寫到眾人反對'], '三個章末動作逐步推進，表現戰士由共同情緒走到集體行動。'],
  ['wu-yi', '「王于興師」中的「興師」是甚麼意思？', ['出動軍隊', '興辦學校', '召見老師', '鼓舞使臣'], '「師」在此指軍隊，「興師」是調動軍隊、出兵。'],
  ['wu-yi', '《無衣》反覆以「豈曰無衣」開篇，從同袍、同澤到同裳。這種章法稱為甚麼？', ['重章疊句', '首尾倒敘', '欲揚先抑', '正話反說'], '每章使用近似句式，替換少量詞語，形成反覆吟唱、層層推進的效果。'],
  ['liao-e', '《蓼莪》前兩章先寫莪、蒿、蔚，再嘆父母養育的辛勞。這種由草木引出感情的手法是甚麼？', ['起興', '用典', '反語', '借代'], '詩以辨認草木起興，接着以「哀哀父母」轉入抒情。兩章以相近句式反覆吟詠。'],
  ['liao-e', '《蓼莪》「蓼蓼者莪，匪莪伊蒿」的「伊」，最接近哪一個意思？', ['是、乃', '美好', '那個人', '只要'], '「匪」通「非」。「匪莪伊蒿」即不是莪，而是蒿。'],
  ['liao-e', '《蓼莪》第四章列舉父母生養、撫育和照料子女，末以「昊天罔極」收結。這四字在文中有甚麼作用？', ['以蒼天無邊形容父母的恩德深厚，難以報答', '以蒼天陰暗說明詩人無法出門探親', '以蒼天無聲責怪父母沒有教導子女', '以蒼天高遠交代父母需要離家遠行'], '「昊天」是廣大的天，「罔極」是沒有盡頭。結句承接想報答父母恩德的心願，寫出感恩與未能報答的哀痛。'],
  ['shi-zuo', '《侍坐章》中，哪一組人物與志向相符？', ['冉有：治理小國，使百姓富足', '子路：願擔任宗廟會同中的小相', '公西華：治理受大國夾逼的千乘之國', '曾皙：使小國百姓衣食無憂'], '子路談治千乘之國，冉有談足民，公西華願學做小相，曾皙描述暮春出遊。'],
  ['shi-zuo', '孔子聽完子路的志向後微笑。文末交代的原因是甚麼？', ['子路談以禮治國，當下言辭卻不謙讓', '子路表示想棄官回鄉', '子路沒有提到治國', '子路的志向與曾皙完全相同'], '孔子重視以禮治國，指出子路「其言不讓」。他評論的是表達欠謙讓。'],
  ['shi-zuo', '「不吾知也」換成現代語序，最接近下列哪項？', ['不了解我', '我不知道', '我不說出來', '我不被允許'], '「吾」是「知」的賓語。否定句中，代詞賓語放在動詞前。'],

    label: classicalLabels[tag] || (passage && passage[0]) || tag,

const byId = new Map(questions.map(question => [question.id, question]));
const pools = Object.fromEntries(Object.keys(questionSets).map(section => [section, questions.filter(question => question.section === section)]));

function loadState() {
  const blank = { section: 'mixed', tag: '', view: 'practice', rounds: {}, seen: {}, missed: {}, attempts: 0, hits: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem(saveKey));
    if (!saved || !Object.hasOwn(sections, saved.section)) return blank;
    const restored = { ...blank, ...saved };
    const isCurrentRound = round => round.items.every(({ id }) => byId.has(id));
    restored.rounds = Object.fromEntries(Object.entries(restored.rounds).filter(([, round]) => isCurrentRound(round)));
    restored.missed = Object.fromEntries(Object.entries(restored.missed).filter(([id]) => byId.has(id)));
    if (restored.section === 'classical' && restored.tag === 'jian-jia') restored.tag = 'liao-e';
    if (restored.tag && !pools[restored.section]?.some(question => question.tag === restored.tag)) restored.tag = '';
    if (restored.drill && !isCurrentRound(restored.drill)) {
      delete restored.drill;
      if (restored.view === 'drill') restored.view = 'review';
    }
    return restored;
  } catch {
    return blank;
  }
}

const state = loadState();

function save() {
  try {
    localStorage.setItem(saveKey, JSON.stringify(state));
  } catch {
    storageText.textContent = '此瀏覽器未能儲存作答紀錄';
  }
}

function escapeText(value) {
  const entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(value).replace(/[&<>"']/g, character => entities[character]);
}

function shuffle(values) {
  const result = [...values];
  for (let index = result.length - 1; index > 0; index--) {
    const position = Math.floor(Math.random() * (index + 1));
    [result[index], result[position]] = [result[position], result[index]];
  }
  return result;
}

function sample(pool, count, done) {
  const fresh = pool.filter(question => !done.has(question.id));
  const previous = pool.filter(question => done.has(question.id));
  return [...shuffle(fresh), ...shuffle(previous)].slice(0, count);
}

function roundKey() {
  return `${state.section}:${state.tag}`;
}

function makeRound(explicitQuestions) {
  const key = roundKey();
  const seen = new Set(state.seen[key] || []);
  let selected = explicitQuestions;
  if (!selected && state.section === 'mixed') {
    selected = shuffle(Object.values(pools).flatMap(pool => sample(pool, 2, seen)));
  }
  if (!selected) {
    const pool = pools[state.section].filter(question => !state.tag || question.tag === state.tag);
    selected = sample(pool, roundSize, seen);
  }
  selected.forEach(question => seen.add(question.id));
  state.seen[key] = [...seen];
  return { items: selected.map(question => ({ id: question.id, order: shuffle([0, 1, 2, 3]) })), answers: {}, position: 0, complete: false };
}

function currentRound() {
  if (state.view === 'drill' && state.drill) return state.drill;
  const key = roundKey();
  if (!state.rounds[key]) {
    state.rounds[key] = makeRound();
    save();
  }
  return state.rounds[key];
}

function missedQuestions() {
  return Object.keys(state.missed).reverse().map(id => byId.get(id)).filter(Boolean);
}

function renderSidebar() {
  const practising = state.view === 'practice';
  const wrongCount = missedQuestions().length;
  navPractice.toggleAttribute('aria-current', state.view !== 'review');
  navReview.toggleAttribute('aria-current', state.view === 'review');
  (state.view === 'review' ? navReview : navPractice).setAttribute('aria-current', 'page');
  navCount.hidden = wrongCount === 0;
  navCount.textContent = wrongCount;

  topics.innerHTML = Object.entries(sections).map(([key, label]) => `
    <button type="button" class="topic" data-section="${key}" aria-pressed="${practising && state.section === key}">
      <span>${label}</span><span class="topic-count">${key === 'mixed' ? questions.length : pools[key].length}</span>
    </button>`).join('');

  const filters = practising && ['classical', 'literature', 'language', 'reading'].includes(state.section)
    ? [...new Map(pools[state.section].map(question => [question.tag, question.label]))]
    : [];
  filter.innerHTML = filters.length ? `
    <label for="subtopic" class="filter-label">細分專題</label>
    <select class="filter" id="subtopic">
      <option value="">全部</option>
      ${filters.map(([tag, label]) => `<option value="${escapeText(tag)}" ${state.tag === tag ? 'selected' : ''}>${escapeText(label)}</option>`).join('')}
    </select>` : '';

  stats.innerHTML = [[state.attempts, '已作答'], [state.attempts ? `${Math.round(100 * state.hits / state.attempts)}%` : '—', '答對率'], [wrongCount, '待重練']]
    .map(([value, label]) => `<div><strong class="stat-number">${value}</strong><span class="stat-label">${label}</span></div>`).join('');
}

  const item = round.items[round.position];
  const question = byId.get(item.id);
  const answer = round.answers[question.id];
  const answered = answer !== undefined;
  const count = round.items.length;
  const completed = Object.keys(round.answers).length;
  const position = round.position + 1;
  const heading = state.view === 'drill' ? '錯題重練' : sections[state.section];
  const passage = question.passage ? `
    <details class="passage" open>
      <summary>閱讀短文</summary>
      <p>${escapeText(question.passage[1])}</p>
    </details>` : '';
  const options = item.order.map((choiceIndex, displayedIndex) => {
    const isAnswer = answered && choiceIndex === 0;
    const pickedWrong = answered && answer !== 0 && choiceIndex === answer;
    const className = isAnswer ? ' is-right' : pickedWrong ? ' is-wrong' : '';
    const status = isAnswer ? '正解' : pickedWrong ? '你的選擇' : '';
    return `<label class="choice${className}">
      <input type="radio" name="choice" value="${choiceIndex}" ${answer === choiceIndex ? 'checked' : ''} ${answered ? 'disabled' : ''}>
      <span class="choice-letter" aria-hidden="true">${letters[displayedIndex]}</span>
      <span class="choice-text">${escapeText(question.options[choiceIndex])}</span>
      ${status ? `<span class="choice-status">${status}</span>` : ''}
    </label>`;
  }).join('');
  const feedback = answered ? `
    <div class="feedback${answer === 0 ? '' : ' wrong'}" tabindex="-1" id="feedback">
      <strong>${answer === 0 ? '答對了' : `正確答案是 ${letters[item.order.indexOf(0)]}`}</strong>
      <p>${escapeText(question.explanation)}</p>
    </div>` : '';

  main.innerHTML = `
    <section class="panel quiz-panel" aria-labelledby="quiz-title">
      <div class="quiz-head"><h2 id="quiz-title">${heading}</h2><p class="quiz-progress">第 ${position} / ${count} 題</p></div>
      <progress class="progress-bar" value="${completed}" max="${count}" aria-label="已答 ${completed} 題，共 ${count} 題"></progress>
      <form id="answer-form">
        <div class="question-line">
          <span class="question-topic">${escapeText(question.label)}</span>
          <p class="question-title" id="question-title" tabindex="-1">${escapeText(question.prompt)}</p>
        </div>
        ${passage}
        <div class="choices" role="radiogroup" aria-labelledby="question-title">${options}</div>
        ${feedback}
        <div class="quiz-actions">
          <button type="button" class="secondary" data-action="prev" ${position === 1 ? 'disabled' : ''}>上一題</button>
          ${answered
            ? `<button type="button" class="primary" data-action="next">${position === count ? '查看結果' : '下一題'}</button>`
            : '<button type="submit" class="primary" id="confirm-answer" disabled>確認答案</button>'}
        </div>
      </form>
      <nav class="question-index" aria-label="題號">
        ${round.items.map(({ id }, index) => {
          const previous = round.answers[id];
          const outcome = previous === 0 ? 'right' : previous === undefined ? '' : 'wrong';
          const description = previous === 0 ? '，答對' : previous === undefined ? '' : '，答錯';
          return `<button type="button" data-position="${index}" aria-label="第 ${index + 1} 題${description}" data-outcome="${outcome}" ${index === round.position ? 'aria-current="step"' : ''} ${index !== round.position && previous === undefined ? 'disabled' : ''}>${index + 1}</button>`;
        }).join('')}
      </nav>
    </section>`;
}

function answerList(items) {
  return `<ul class="answer-list">${items.map(({ question, answer }) => `
    <li><details>
      <summary><span class="list-marker${answer === 0 ? '' : ' wrong'}">${answer === 0 ? '答對' : '答錯'}</span>
        ${escapeText(question.prompt)}</summary>
      ${question.passage ? `<p>${escapeText(question.passage[1])}</p>` : ''}
      ${answer === 0 ? '' : `<p>你的答案：${escapeText(question.options[answer])}</p>`}
      <p><strong>正解：</strong>${escapeText(question.options[0])}</p>
      <p>${escapeText(question.explanation)}</p>
    </details></li>`).join('')}</ul>`;
}

function renderResult(round) {
  const items = round.items.map(({ id }) => ({ question: byId.get(id), answer: round.answers[id] }));
  const correct = items.filter(item => item.answer === 0).length;
  const wrong = items.length - correct;
  const heading = state.view === 'drill' ? '錯題重練完成' : '本輪練習完成';
  main.innerHTML = `
    <section class="panel result-panel" aria-labelledby="result-title">
      <h2 id="result-title" tabindex="-1">${heading}</h2>
      <div class="score-banner"><strong>${correct} / ${items.length}</strong><span>答對 ${correct} 題${wrong ? `，答錯 ${wrong} 題` : '，本輪全對。'}</span></div>
      <div class="result-actions">
        ${wrong ? '<button type="button" class="primary" data-action="retry-round">重做本輪錯題</button>' : ''}
        <button type="button" class="${wrong ? 'secondary' : 'primary'}" data-action="new-round">開始新一輪</button>
      </div>
      <p class="result-intro">展開題目查看答案和解析。</p>
      ${answerList(items)}
    </section>`;
}

function renderReview() {
  const missed = missedQuestions();
  main.innerHTML = `
    <section class="panel review-panel" aria-labelledby="review-title">
      <h2 id="review-title" tabindex="-1">錯題簿</h2>
      ${missed.length ? `
        <p class="review-intro">目前有 ${missed.length} 題待重練。再次答對，題目就會移出錯題簿。</p>
        <div class="result-actions"><button type="button" class="primary" data-action="retry-review">重練錯題（${Math.min(missed.length, roundSize)} 題）</button></div>
        ${answerList(missed.map(question => ({ question, answer: state.missed[question.id] })))}
      ` : `
        <p class="empty-review">目前沒有待重練的題目。</p>
        <button type="button" class="primary" data-view="practice">返回練習</button>
      `}
    </section>`;
}

function render(focus) {
  renderSidebar();
  if (state.view === 'review') {
    renderReview();
  } else {
    const round = currentRound();
    if (round.complete) renderResult(round);
    else renderQuiz(round);
  }
  if (focus) {
    const target = document.querySelector(focus === 'content' ? '#question-title, #result-title, #review-title' : focus);
    target?.focus({ preventScroll: focus === '#feedback' });
  }
}

function beginDrill(items) {
  state.drill = makeRound(items);
  state.view = 'drill';
}

document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button || button.disabled) return;
  const { view, section, position, action } = button.dataset;

  if (view) {
    state.view = view;
  } else if (section) {
    state.section = section;
    state.tag = '';
    state.view = 'practice';
  } else if (action === 'retry-review') {
    beginDrill(missedQuestions().slice(0, roundSize));
  } else if (position !== undefined || action) {
    const round = currentRound();
    if (position !== undefined) {
      round.position = Number(position);
    } else if (action === 'prev') {
      round.position--;
    } else if (action === 'next') {
      if (round.position === round.items.length - 1) round.complete = true;
      else round.position++;
    } else if (action === 'new-round') {
      state.view = 'practice';
      state.rounds[roundKey()] = makeRound();
    } else if (action === 'retry-round') {
      beginDrill(round.items.filter(({ id }) => round.answers[id] !== 0).map(({ id }) => byId.get(id)));
    }
  } else {
    return;
  }
  save();
  render('content');
});

document.addEventListener('change', event => {
  if (event.target.id === 'subtopic') {
    state.tag = event.target.value;
    save();
    render('content');
  } else if (event.target.name === 'choice') {
    document.querySelector('#confirm-answer').disabled = false;
  }
});

main.addEventListener('submit', event => {
  if (event.target.id !== 'answer-form') return;
  event.preventDefault();
  const selected = new FormData(event.target).get('choice');
  if (selected === null) return;
  const round = currentRound();
  const { id } = round.items[round.position];
  if (round.answers[id] !== undefined) return;
  const answer = Number(selected);
  round.answers[id] = answer;
  state.attempts++;
  if (answer === 0) {
    state.hits++;
    delete state.missed[id];
  } else {
    delete state.missed[id];
    state.missed[id] = answer;
  }
  save();
  render('#feedback');
});

document.querySelector('#bank-size').textContent = questions.length;
render();
</script>
</body>
</html>
